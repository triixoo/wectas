name: Market watch

on:
  schedule:
    - cron: '0 5 * * 1' # Monday 10:00 Asia/Almaty. GitHub may delay scheduled jobs.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: wectas-market-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm test
      - name: Check primary sources and save an iteration issue
        run: node scripts/market-watch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the monitoring snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/market-watch.json research/monitor-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh market source monitoring'
          git push origin HEAD:main
